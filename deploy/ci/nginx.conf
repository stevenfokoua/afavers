# This disposable gateway serves browsers on another loopback port. Keep CORS
# confined to loopback origins; upstream defaults vary between Auth/REST images.
map $http_origin $afavers_ci_origin {
    default "";
    ~^http://127\.0\.0\.1:[0-9]+$ $http_origin;
    ~^http://localhost:[0-9]+$ $http_origin;
}

server {
    listen 8080;
    server_name _;
    client_max_body_size 1m;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Expose-Headers;
    add_header Access-Control-Allow-Origin $afavers_ci_origin always;
    add_header Access-Control-Allow-Methods 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
    add_header Access-Control-Allow-Headers 'Authorization, Apikey, Content-Type, X-Client-Info, X-Supabase-Api-Version, Prefer, Accept-Profile, Content-Profile, Range, Range-Unit' always;
    add_header Access-Control-Expose-Headers 'Content-Range, Range-Unit, Preference-Applied, X-Total-Count, Link' always;
    add_header Vary Origin always;
    if ($request_method = OPTIONS) { return 204; }
    location /backend/auth/v1/ {
        proxy_pass http://auth:9999/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto http;
    }
    location /backend/rest/v1/ {
        proxy_pass http://rest:3000/;
        proxy_set_header Host $host;
    }
    # Worker integrations have separate unit/live gates. Never call a production
    # feed or silently mock a successful worker result in this backend.
    location /backend/functions/v1/ { return 503; }
    location / { return 404; }
}
