# Disposable real backend for browser regression checks. No production env file.
x-owned: &owned
  local.agent.owner: ${AGENT_RESOURCE_OWNER:?owner required}
  local.agent.lifecycle: temporary
  local.agent.reason: Afavers hermetic browser regression backend
x-common: &common
  labels: *owned
  restart: 'no'
  logging:
    driver: json-file
    options: { max-size: 3m, max-file: '1' }
  security_opt: [no-new-privileges:true]

services:
  db:
    <<: *common
    image: supabase/postgres:17.6.1.136@sha256:f371b5f3f2ac0a05703f33d6e6134515fb2498cab708fb948a0aeb7481467c00
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1
    pids_limit: 128
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?generated password required}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_PORT: '5432'
      PGPORT: '5432'
      JWT_EXP: '3600'
    volumes:
      - db-data:/var/lib/postgresql/data
      - db-config:/etc/postgresql-custom
      - ${AFAVERS_REPO:?repo required}/deploy/ci/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ${AFAVERS_REPO}/deploy/bootstrap/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
    command: [postgres, -c, config_file=/etc/postgresql/postgresql.conf, -c, shared_buffers=64MB, -c, work_mem=2MB, -c, maintenance_work_mem=32MB, -c, max_connections=40, -c, log_min_messages=warning, -c, cron.launch_active_jobs=off]
    healthcheck:
      test: [CMD, pg_isready, -U, postgres, -h, localhost]
      interval: 2s
      timeout: 5s
      retries: 60
  auth:
    <<: *common
    image: supabase/gotrue:v2.197.0@sha256:1736a63078f5922b198c4cbe50f80ab9a2d3b54fe8b7b6cfb2e9dc5dbbc12c6b
    mem_limit: 160m
    memswap_limit: 160m
    cpus: 0.5
    pids_limit: 64
    depends_on: { db: { condition: service_healthy }, mail: { condition: service_started } }
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: '9999'
      API_EXTERNAL_URL: http://127.0.0.1:${AFAVERS_CI_API_PORT:-18080}/backend
      GOTRUE_SITE_URL: http://127.0.0.1:${AFAVERS_CI_APP_PORT:-4173}
      GOTRUE_URI_ALLOW_LIST: http://127.0.0.1:${AFAVERS_CI_APP_PORT:-4173}/**
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_DB_MAX_POOL_SIZE: '5'
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?generated secret required}
      GOTRUE_JWT_EXP: '3600'
      GOTRUE_JWT_ISSUER: http://127.0.0.1:${AFAVERS_CI_API_PORT:-18080}/backend/auth/v1
      GOTRUE_DISABLE_SIGNUP: 'false'
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      GOTRUE_MAILER_AUTOCONFIRM: 'false'
      GOTRUE_SMTP_HOST: mail
      GOTRUE_SMTP_PORT: '1025'
      GOTRUE_SMTP_ADMIN_EMAIL: afavers@ci.example.invalid
      GOTRUE_SMTP_SENDER_NAME: Afavers CI
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /backend/auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /backend/auth/v1/verify
      GOTRUE_MAILER_URLPATHS_INVITE: /backend/auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /backend/auth/v1/verify
      GOTRUE_RATE_LIMIT_EMAIL_SENT: '100'
    healthcheck:
      test: [CMD, wget, --no-verbose, --tries=1, --spider, 'http://localhost:9999/health']
      interval: 2s
      timeout: 5s
      retries: 60
  rest:
    <<: *common
    image: postgrest/postgrest:v14.18@sha256:c7cd7e265a85b05248abf53f4473fcec7e327c282d0bd0cf60f1551996d09fcf
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.5
    pids_limit: 64
    depends_on: { db: { condition: service_healthy } }
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_POOL: '5'
      PGRST_DB_MAX_ROWS: '1000'
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: 'false'
      PGRST_ADMIN_SERVER_PORT: '3001'
      PGRST_ADMIN_SERVER_HOST: localhost
    healthcheck:
      test: [CMD, postgrest, --ready]
      interval: 2s
      timeout: 5s
      retries: 60
  mail:
    <<: *common
    image: axllent/mailpit:v1.32.0@sha256:0790692be935ea4420d085694f7985b1f692ca6a8771ab0e0bd8ba75ac180498
    mem_limit: 96m
    memswap_limit: 96m
    cpus: 0.25
    pids_limit: 64
    ports: ['127.0.0.1:${AFAVERS_CI_MAIL_PORT:-18025}:8025']
    environment:
      MP_DATABASE: /tmp/mailpit.db
      MP_MAX_MESSAGES: '100'
      MP_DISABLE_VERSION_CHECK: 'true'
      MP_SMTP_AUTH_ACCEPT_ANY: 'false'
  gateway:
    <<: *common
    image: nginx:1.30.6-alpine@sha256:0e52bd054126cdc040b1276c0af347aeb02a41b9cfe305d6094767ac30e97949
    mem_limit: 32m
    memswap_limit: 32m
    cpus: 0.25
    pids_limit: 32
    depends_on: { auth: { condition: service_healthy }, rest: { condition: service_healthy } }
    ports: ['127.0.0.1:${AFAVERS_CI_API_PORT:-18080}:8080']
    volumes:
      - ${AFAVERS_REPO}/deploy/ci/nginx.conf:/etc/nginx/conf.d/default.conf:ro

networks:
  default:
    labels: *owned
volumes:
  db-data: { labels: *owned }
  db-config: { labels: *owned }
