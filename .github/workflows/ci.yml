name: CI

on:
  push:
    branches: [main, codex/afavers-production-readiness]
  pull_request:
  workflow_dispatch:

jobs:
  # ─── Type-check ─────────────────────────────────────────────────────────────
  typecheck:
    name: TypeScript type-check (client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tsc
        working-directory: client
        run: npx tsc -b --noEmit

  # ─── Unit tests ─────────────────────────────────────────────────────────────
  test:
    name: Vitest unit tests (client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --workspace=client

      - name: Verify operations, capacity and release packaging contracts
        run: |
          python -m unittest discover -s deploy -p 'test_*.py'
          python -m unittest discover -s deploy/ci -p 'test_*.py'

  # ─── Build ──────────────────────────────────────────────────────────────────
  build:
    name: Vite production build (client)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --workspace=client
        env:
          # Provide placeholder values so the Supabase client initialisation
          # warning does not cause a non-zero exit code.
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key

  # ─── Supabase Functions type-check (Deno) ───────────────────────────────────
  deno-typecheck:
    name: Deno type-check (supabase/functions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check supabase functions
        run: deno check supabase/functions/*/index.ts

      - name: Exercise SMTP acceptance and retry handling on loopback
        run: deno test --allow-env=SMTP_HOST,SMTP_PORT,SMTP_FROM --allow-net=127.0.0.1 supabase/functions/_shared/smtp.test.ts

  e2e:
    name: Real backend browser regression (desktop and phone)
    runs-on: ubuntu-latest
    needs: [typecheck, test, build, deno-typecheck]
    timeout-minutes: 20
    env:
      AGENT_RESOURCE_OWNER: github-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check browser regression tests
        run: npm run test:e2e:types --workspace=client
      - name: Install pinned Chromium and WebKit engines
        run: npx playwright install --with-deps chromium webkit
        working-directory: client
      - name: Exercise the compiled app with an isolated real backend
        run: python deploy/ci/run-e2e.py run
      - name: Retire exact owned backend if an earlier step was interrupted
        if: always()
        run: |
          if [ -f .ci-runtime/active.json ]; then
            python deploy/ci/run-e2e.py cleanup
          fi
      - name: Preserve verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: afavers-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            client/playwright-report/
            client/test-results/
            reports/e2e/

  production-release:
    name: Verified production frontend artifact
    runs-on: ubuntu-latest
    needs: e2e
    if: github.ref == 'refs/heads/codex/afavers-production-readiness' && github.event_name != 'pull_request'
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      AFAVERS_SUPABASE_URL: ${{ vars.AFAVERS_SUPABASE_URL }}
      AFAVERS_SUPABASE_ANON_KEY: ${{ vars.AFAVERS_SUPABASE_ANON_KEY }}
      VITE_SUPABASE_URL: ${{ vars.AFAVERS_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.AFAVERS_SUPABASE_ANON_KEY }}
      VITE_APP_VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            extension/package-lock.json
      - name: Check public production configuration
        run: |
          python - <<'PY'
          import importlib.util, os
          spec = importlib.util.spec_from_file_location('production', 'deploy/ci/package-production.py')
          production = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(production)
          production.public_configuration(os.environ['AFAVERS_SUPABASE_URL'], os.environ['AFAVERS_SUPABASE_ANON_KEY'])
          PY
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Build frontend for production
        run: npm run build --workspace=client
      - name: Install locked extension dependencies
        working-directory: extension
        run: npm ci
      - name: Rebuild extension
        working-directory: extension
        run: npm run build
      - name: Verify release packaging contract
        run: python -m unittest discover -s deploy/ci -p test_package_production.py
      - name: Package production release and source metadata
        run: python deploy/ci/package-production.py --out reports/production-release
      - name: Preserve production release for explicit deployment
        uses: actions/upload-artifact@v4
        with:
          name: afavers-production-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            reports/production-release/frontend.tar.gz
            reports/production-release/frontend.tar.gz.sha256
            reports/production-release/source.json
